<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="outtathelabyrinth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Comfortaa:wght@300..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Ingrid+Darling&family=La+Belle+Aurore&family=Monsieur+La+Doulaise&family=Noto+Serif:ital,wdth,wght@0,75,100..900;1,75,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+CU+Guides&family=Rubik+Glitch&family=Sankofa+Display&family=Special+Elite&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    




 <div id="typewriter"></div><span id="cursor">|</span>

  <script>
    const text = `Meditating thus I arrived at a high, rusty iron gate. and made it out of the labyrinth. Through the railings I could see an avenue bordered with poplar trees and also a kind of summer house or pavilion. Two things dawned on me at once, the first trivial and the second almost incredible: the music came from the pavilion and that music was Chinese. That was why I had accepted it fully, without paying it any attention. I do not remember whether there was a bell, a push-button, or whether I attracted attention by clapping my hands. The stuttering sparks of the music kept on.


   `;

    let index = 0;

    function type() {
      if (index < text.length) {
        document.getElementById("typewriter").textContent += text[index];

        // Check if the character is a sentence-ending punctuation
        const char = text[index];
        const isSentenceEnd = char === "." || char === "!" || char === "?";

        index++;

        // Normal typing speed
        let delay = 90;

        // Add pause after sentences
        if (isSentenceEnd) {
          delay = 400; // pause for 0.4s after a sentence
        }

        setTimeout(type, delay);
      }
    }

    type();
  </script>

</div>





</body>
</html>
